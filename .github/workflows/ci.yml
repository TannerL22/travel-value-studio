name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m py_compile backend/main.py backend/data_sources.py backend/source_registry.py backend/model_contract.py backend/fx_opportunity.py backend/phase2_registry.py backend/basic_comfort.py backend/phase3_registry.py backend/service_depth.py backend/phase4_registry.py backend/city_intelligence.py backend/phase5_registry.py backend/mobility_digital.py backend/phase6_registry.py backend/ranking_v7.py backend/phase7_registry.py
      - name: Run backend sanity checks
        run: python backend/sanity_checks.py
      - name: Run Phase 2 FX checks
        run: python backend/fx_opportunity_checks.py
      - name: Run Phase 3 comfort checks
        run: python backend/basic_comfort_checks.py
      - name: Run Phase 4 service depth checks
        run: python backend/service_depth_checks.py
      - name: Run Phase 5 city intelligence checks
        run: python backend/city_intelligence_checks.py
      - name: Run Phase 6 mobility and digital checks
        run: python backend/mobility_digital_checks.py
      - name: Run Phase 7 ranking rebuild checks
        run: python backend/ranking_v7_checks.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
